services:
  mongodb:
    image: mongo:7
    container_name: arigastro-mongo
    restart: always
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: arigastro-backend
    restart: always
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=arigastro_db
      - CORS_ORIGINS=*
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FEED_URL=${FEED_URL}
      - SCRAPERAPI_KEY=${SCRAPERAPI_KEY}
      - AKAKCE_EMAIL=${AKAKCE_EMAIL}
      - AKAKCE_PASSWORD=${AKAKCE_PASSWORD}
      - IKAS_CLIENT_ID=${IKAS_CLIENT_ID}
      - IKAS_CLIENT_SECRET=${IKAS_CLIENT_SECRET}
      - GOOGLE_ADS_CUSTOMER_ID=${GOOGLE_ADS_CUSTOMER_ID}
      - GOOGLE_ADS_MCC_ID=${GOOGLE_ADS_MCC_ID}
      - GOOGLE_ADS_DEVELOPER_TOKEN=${GOOGLE_ADS_DEVELOPER_TOKEN}
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID}
      - GSC_SITE_URL=${GSC_SITE_URL}
      - GOOGLE_SERVICE_ACCOUNT_PATH=google_service_account.json
      - GOOGLE_ADS_OAUTH_CLIENT_ID=${GOOGLE_ADS_OAUTH_CLIENT_ID}
      - GOOGLE_ADS_OAUTH_CLIENT_SECRET=${GOOGLE_ADS_OAUTH_CLIENT_SECRET}
      - GOOGLE_ADS_REFRESH_TOKEN=${GOOGLE_ADS_REFRESH_TOKEN}
      - CURRENCY_API_KEY=${CURRENCY_API_KEY}
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    container_name: arigastro-frontend
    restart: always
    depends_on:
      - backend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  mongo_data:
